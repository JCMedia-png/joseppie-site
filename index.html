<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jolly Joey's Pregame Extravaganza</title>
<meta name="description" content="Be there or be square. Tonight, 6 PM.">
<meta property="og:title" content="Jolly Joey's Pregame Extravaganza">
<meta property="og:description" content="Be there or be square. Let's fucking party.">
<meta property="og:image" content="http://joseppie.com/img/poster.jpg">
<meta name="theme-color" content="#110a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#110a1c;--card:#1b1030;--ink:#fff6ea;--muted:#bfb2d6;--pink:#ff2e88;--gold:#ffb703;--line:rgba(255,246,234,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;color:var(--ink);text-align:center;font:500 1.0625rem/1.5 "Bricolage Grotesque",system-ui,sans-serif;
  background:radial-gradient(90% 45% at 50% 0%,rgba(255,46,136,.38),transparent 70%),radial-gradient(80% 40% at 50% 100%,rgba(255,183,3,.18),transparent 70%),var(--bg);background-attachment:fixed}
main{width:min(520px,100% - 32px);margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 0 64px}
em.s{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--gold)}
h1{font-weight:800;font-size:clamp(2.6rem,12vw,4.5rem);line-height:.92;letter-spacing:-.045em}
h1 em.s{display:block;font-size:1.08em;letter-spacing:-.01em;margin-top:.06em}
.sub{margin-top:18px;font-size:clamp(1.15rem,4.6vw,1.4rem);font-weight:800;letter-spacing:-.01em}
.sub span{color:var(--pink)}
.cue{margin-top:34px;font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cue::after{content:"↓";display:block;font-size:1.3rem;letter-spacing:0;margin-top:6px;color:var(--pink);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.video{margin:14px auto 0;width:100%;max-width:400px;aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:var(--card);
  border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(255,46,136,.55);position:relative}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.soon{position:absolute;inset:0;display:grid;place-content:center;gap:10px;padding:24px;color:var(--muted)}
.soon b{font-size:1.6rem;color:var(--ink);letter-spacing:-.02em}
.invite{margin-top:56px;padding:32px 22px;border-radius:24px;border:1px solid var(--line);background:rgba(255,246,234,.05)}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
.invite h2{margin-top:10px;font-size:clamp(1.8rem,8vw,2.4rem);line-height:1;letter-spacing:-.035em}
.step{margin-top:24px;font-size:1.25rem;line-height:1.35;font-weight:800}
.step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;font-size:1rem;margin-bottom:10px}
.step small{display:block;font-weight:500;color:var(--muted);font-size:1rem;margin-top:4px}
.closer{margin-top:24px;color:var(--muted);font-size:1.05rem}
.closer strong{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.cue::after{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Jolly Joey's Pregame <em class="s">Extravaganza</em></h1>
  <p class="sub">Be there or be square. <span>Let's fucking party.</span></p>

  <p class="cue">Watch the video below</p>
  <div class="video" id="video">
    <video src="img/invite-video.mp4" playsinline controls preload="metadata" poster="img/poster.jpg"></video>
  </div>

  <section class="invite">
    <div class="eyebrow">Formal invitation with instructions</div>
    <h2>Your <em class="s">orders</em></h2>
    <p class="step"><span class="n">1</span><br>Meet at Veneto Las Olas at 6 PM.<small>Tonight. Friday, November 6.</small></p>
    <p class="closer">Dudeeeeee... to all my party people, <strong>be there or be square motherfuckers.</strong></p>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
(function(){
  if(!window.confetti) return;
  const colors=['#ff2e88','#ffb703','#fff6ea','#9b5cff','#2ee6d6'];
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Opening burst from both bottom corners
  const burst=(o)=>confetti(Object.assign({particleCount:calm?40:110,spread:75,startVelocity:55,colors,disableForReducedMotion:false,scalar:1.05},o));
  burst({angle:60,origin:{x:0,y:.9}}); burst({angle:120,origin:{x:1,y:.9}});
  setTimeout(()=>burst({angle:90,spread:120,origin:{x:.5,y:.35},particleCount:calm?30:90}),450);
  // Gentle drizzle from the top
  if(!calm){
    setInterval(()=>{ if(document.hidden) return;
      confetti({particleCount:2,startVelocity:0,ticks:400,gravity:.55,drift:Math.random()-.5,origin:{x:Math.random(),y:-.05},colors,scalar:.9});
    },220);
  }
  // Tap anywhere for more
  addEventListener('pointerdown',e=>{
    if(e.target.closest('video')) return;
    confetti({particleCount:60,spread:70,startVelocity:35,colors,origin:{x:e.clientX/innerWidth,y:e.clientY/innerHeight}});
  });
})();
</script>
</body>
</html>
